<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Carstore</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); width: 320px; }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #333; }
        input { width: 100%; padding: .6rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: .7rem; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #1565c0; }
        .error { color: red; text-align: center; margin-bottom: 1rem; }
        .success { color: green; text-align: center; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="card">
    <h2>Carstore Login</h2>
    <p th:if="${param.error}" class="error">Usuário ou senha inválidos.</p>
    <p th:if="${param.logout}" class="success">Logout realizado com sucesso.</p>
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Usuário" required/>
        <input type="password" name="password" placeholder="Senha" required/>
        <button type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
