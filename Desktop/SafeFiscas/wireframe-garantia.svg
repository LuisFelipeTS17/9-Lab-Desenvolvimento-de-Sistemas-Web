    <rect x="30" y="204" width="150" height="9" rx="3" fill="#666"/>
    <rect x="30" y="228" width="150" height="24" rx="12" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/>
    <text x="42" y="244" font-size="10" fill="#333">Bandeja L.D.  +6 itens</text>
    <rect x="196" y="176" width="60" height="20" rx="10" fill="#111"/>
    <text x="226" y="190" font-size="9" fill="#fff" text-anchor="middle">Ativa</text>
    <!-- warning small -->
    <path d="M204 240 l6 -11 l6 11 z" fill="none" stroke="#111" stroke-width="1.5"/>
    <text x="211" y="239" font-size="8" fill="#111" text-anchor="middle">!</text>
    <text x="218" y="245" font-size="9" fill="#111">7 dias</text>
    <!-- card 2 -->
    <rect x="16" y="272" width="248" height="92" rx="12" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
    <text x="30" y="296" font-size="12" font-weight="bold" fill="#111">M. Santos · XYZ4E56</text>
    <rect x="30" y="308" width="140" height="9" rx="3" fill="#666"/>
    <rect x="30" y="332" width="130" height="24" rx="12" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/>
