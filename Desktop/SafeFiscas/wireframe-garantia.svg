    <text x="28" y="197" font-size="11" font-weight="bold" fill="#111">Bandeja L.D.</text>
    <text x="28" y="212" font-size="9" fill="#777">Garantia ativa</text>
    <text x="252" y="205" font-size="11" font-weight="bold" fill="#111" text-anchor="end">7 dias</text>
    <!-- item 2 -->
    <rect x="16" y="226" width="248" height="38" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
    <text x="28" y="242" font-size="11" fill="#111">Amortecedor D.D.</text>
    <text x="28" y="256" font-size="9" fill="#777">Garantia ativa</text>
    <text x="252" y="250" font-size="10" fill="#666" text-anchor="end">40 dias</text>
    <!-- item 3 -->
    <rect x="16" y="270" width="248" height="38" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
    <text x="28" y="286" font-size="11" fill="#111">Pastilha dianteira</text>
    <text x="28" y="300" font-size="9" fill="#999">Acionada em 03/05</text>
    <rect x="212" y="279" width="44" height="18" rx="9" fill="#e0e0e0"/>
    <text x="234" y="292" font-size="8" fill="#333" text-anchor="middle">Acionada</text>
    <!-- item 4 -->
    <rect x="16" y="314" width="248" height="38" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
    <text x="28" y="330" font-size="11" fill="#111">Óleo 5W30</text>
    <text x="28" y="344" font-size="9" fill="#999">Sem garantia</text>
    <text x="252" y="338" font-size="10" fill="#bbb" text-anchor="end">—</text>
    <text x="140" y="374" font-size="10" fill="#111" text-anchor="middle" text-decoration="underline">ver os outros 3 itens</text>
    <!-- action note + buttons -->
    <text x="140" y="404" font-size="9" fill="#999" text-anchor="middle">Toque num item para acionar ou devolver</text>
    <rect x="16" y="416" width="120" height="44" rx="22" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="76" y="443" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">Acionar item</text>
    <rect x="144" y="416" width="120" height="44" rx="22" fill="#111"/>
    <text x="204" y="443" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Devolver item</text>
    <line x1="16" y1="478" x2="264" y2="478" stroke="#eee"/>
    <text x="20" y="500" font-size="9" fill="#999">DISTRIBUIDORA · NF</text>
    <rect x="20" y="506" width="150" height="9" rx="3" fill="#333"/>
    <text x="20" y="536" font-size="9" fill="#999">TOTAL DA NOTA</text>
    <text x="252" y="536" font-size="14" font-weight="bold" fill="#111" text-anchor="end">R$ 2.340</text>
  </g>
  <text x="540" y="1396" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">4 · Nota: alerta + itens (garantia por peça)</text>

  <!-- ================= SCREEN 5: RELATÓRIO DEVOLUÇÕES ================= -->
  <g transform="translate(40,770)">
    <rect x="0" y="0" width="280" height="600" rx="28" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <rect x="95" y="16" width="90" height="8" rx="4" fill="#ddd"/>
    <text x="20" y="60" font-size="15" font-weight="bold" fill="#111">Devoluções</text>
    <line x1="14" y1="74" x2="266" y2="74" stroke="#eee" stroke-width="2"/>
    <rect x="16" y="88" width="248" height="38" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
    <text x="28" y="112" font-size="12" fill="#333">Maio 2024</text>
    <path d="M238 104 l8 0 l-4 6 z" fill="#666"/>
    <text x="16" y="150" font-size="9" fill="#999">ITENS DEVOLVIDOS NO MÊS</text>
    <line x1="16" y1="158" x2="264" y2="158" stroke="#eee" stroke-width="1.5"/>
    <rect x="20" y="172" width="120" height="9" rx="3" fill="#333"/>
    <rect x="20" y="188" width="90" height="7" rx="3" fill="#bbb"/>
    <text x="256" y="184" font-size="12" font-weight="bold" fill="#111" text-anchor="end">R$ 180</text>
    <line x1="16" y1="212" x2="264" y2="212" stroke="#eee" stroke-width="1.5"/>
    <rect x="20" y="226" width="130" height="9" rx="3" fill="#333"/>
    <rect x="20" y="242" width="90" height="7" rx="3" fill="#bbb"/>
    <text x="256" y="238" font-size="12" font-weight="bold" fill="#111" text-anchor="end">R$ 140</text>
    <line x1="16" y1="266" x2="264" y2="266" stroke="#eee" stroke-width="1.5"/>
    <rect x="20" y="280" width="110" height="9" rx="3" fill="#333"/>
    <rect x="20" y="296" width="90" height="7" rx="3" fill="#bbb"/>
    <text x="256" y="292" font-size="12" font-weight="bold" fill="#111" text-anchor="end">R$ 220</text>
    <line x1="16" y1="320" x2="264" y2="320" stroke="#eee" stroke-width="1.5"/>
    <rect x="20" y="334" width="120" height="9" rx="3" fill="#333"/>
    <rect x="20" y="350" width="90" height="7" rx="3" fill="#bbb"/>
    <text x="256" y="346" font-size="12" font-weight="bold" fill="#111" text-anchor="end">R$ 100</text>
    <line x1="16" y1="374" x2="264" y2="374" stroke="#eee" stroke-width="1.5"/>
    <rect x="16" y="470" width="248" height="72" rx="12" fill="#f0f0f0" stroke="#111" stroke-width="2"/>
    <text x="32" y="500" font-size="11" fill="#666">Total devolvido no mês</text>
    <text x="32" y="528" font-size="26" font-weight="bold" fill="#111">R$ 640,00</text>
  </g>
  <text x="180" y="1396" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">5 · Relatório p/ o acerto</text>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(760,770)">
    <rect x="0" y="0" width="280" height="600" rx="16" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
    <text x="20" y="42" font-size="16" font-weight="bold" fill="#111">O que mudou (v1.1)</text>
    <line x1="20" y1="54" x2="260" y2="54" stroke="#ddd" stroke-width="1.5"/>

    <circle cx="28" cy="84" r="4" fill="#111"/>
    <text x="42" y="80" font-size="12" font-weight="bold" fill="#111">Nota tem vários itens</text>
    <text x="42" y="98" font-size="11" fill="#666">1 revisão = até 20 peças numa</text>
    <text x="42" y="114" font-size="11" fill="#666">nota. Cada peça, sua garantia.</text>

    <circle cx="28" cy="148" r="4" fill="#111"/>
    <text x="42" y="144" font-size="12" font-weight="bold" fill="#111">Card: peça + (+N itens)</text>
    <text x="42" y="162" font-size="11" fill="#666">Mostra a principal e o contador.</text>
    <text x="42" y="178" font-size="11" fill="#666">Toque abre a lista completa.</text>

    <circle cx="28" cy="212" r="4" fill="#111"/>
    <text x="42" y="208" font-size="12" font-weight="bold" fill="#111">Alerta da mais perto</text>
    <text x="42" y="226" font-size="11" fill="#666">O topo mostra a peça que vence</text>
    <text x="42" y="242" font-size="11" fill="#666">primeiro. Aviso aos 7 dias.</text>
    <text x="42" y="258" font-size="11" fill="#666">Vira assistente, não arquivo.</text>

    <circle cx="28" cy="292" r="4" fill="#111"/>
    <text x="42" y="288" font-size="12" font-weight="bold" fill="#111">Ação por item</text>
    <text x="42" y="306" font-size="11" fill="#666">Aciona/devolve só a peça que</text>
    <text x="42" y="322" font-size="11" fill="#666">deu problema, sem mexer no resto.</text>

    <line x1="20" y1="352" x2="260" y2="352" stroke="#ddd" stroke-width="1.5"/>
    <text x="20" y="378" font-size="12" font-weight="bold" fill="#111">Muda no banco:</text>
    <text x="20" y="398" font-size="11" fill="#999">nasce a tabela ItemNota (peça,</text>
    <text x="20" y="414" font-size="11" fill="#999">valor, prazo, status), ligada</text>
    <text x="20" y="430" font-size="11" fill="#999">à Nota. Garantia = por item.</text>

    <rect x="20" y="454" width="240" height="1" fill="#ddd"/>
    <text x="20" y="482" font-size="11" fill="#666" font-style="italic">Rascunho para conversa —</text>
    <text x="20" y="500" font-size="11" fill="#666" font-style="italic">as telas mudam depois do</text>
    <text x="20" y="518" font-size="11" fill="#666" font-style="italic">feedback dos donos de loja.</text>
  </g>
</svg>
