    <text x="140" y="524" font-size="11" fill="#777" text-anchor="middle" text-decoration="underline">ou escolher da galeria</text>
  </g>
  <text x="540" y="726" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">2 · Foto (sem digitar)</text>

  <!-- ================= SCREEN 3: CONFERIR DADOS + ITENS ================= -->
  <g transform="translate(760,100)">
    <rect x="0" y="0" width="280" height="600" rx="28" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <rect x="95" y="16" width="90" height="8" rx="4" fill="#ddd"/>
    <text x="20" y="52" font-size="15" font-weight="bold" fill="#111">Conferir dados</text>
    <text x="20" y="70" font-size="10" fill="#999">A IA leu a nota. Confira e corrija.</text>
    <line x1="14" y1="80" x2="266" y2="80" stroke="#eee" stroke-width="2"/>
    <text x="18" y="102" font-size="9" fill="#999">CLIENTE · TELEFONE</text>
    <rect x="16" y="108" width="248" height="32" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
    <rect x="28" y="120" width="170" height="9" rx="3" fill="#333"/>
    <text x="18" y="160" font-size="9" fill="#999">PLACA</text>
    <rect x="16" y="166" width="120" height="32" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
    <rect x="28" y="178" width="80" height="9" rx="3" fill="#333"/>
