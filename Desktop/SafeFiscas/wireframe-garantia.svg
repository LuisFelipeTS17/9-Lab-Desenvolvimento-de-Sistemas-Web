    <rect x="160" y="178" width="70" height="9" rx="3" fill="#333"/>
    <text x="18" y="218" font-size="9" fill="#999">DISTRIBUIDORA · Nº NF · VENDEDOR</text>
    <rect x="16" y="224" width="248" height="32" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
    <rect x="28" y="236" width="180" height="9" rx="3" fill="#333"/>
    <!-- itens block -->
    <text x="18" y="282" font-size="9" fill="#999">ITENS LIDOS DA NOTA</text>
    <rect x="16" y="288" width="248" height="150" rx="10" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
    <line x1="16" y1="318" x2="264" y2="318" stroke="#eee"/>
    <rect x="28" y="300" width="120" height="8" rx="3" fill="#333"/>
    <text x="252" y="308" font-size="9" fill="#666" text-anchor="end">6m garantia</text>
    <line x1="16" y1="348" x2="264" y2="348" stroke="#eee"/>
    <rect x="28" y="330" width="130" height="8" rx="3" fill="#333"/>
    <text x="252" y="338" font-size="9" fill="#666" text-anchor="end">3m garantia</text>
    <line x1="16" y1="378" x2="264" y2="378" stroke="#eee"/>
    <rect x="28" y="360" width="110" height="8" rx="3" fill="#333"/>
    <text x="252" y="368" font-size="9" fill="#666" text-anchor="end">sem</text>
    <rect x="28" y="392" width="90" height="8" rx="3" fill="#333"/>
    <text x="150" y="400" font-size="9" fill="#999">... +4 itens</text>
    <text x="140" y="426" font-size="10" fill="#111" text-anchor="middle" text-decoration="underline">editar prazo de cada peça</text>
    <rect x="16" y="452" width="248" height="50" rx="25" fill="#111"/>
    <text x="140" y="483" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Salvar garantia</text>
    <text x="140" y="534" font-size="10" fill="#bbb" text-anchor="middle">▲ role para conferir tudo</text>
  </g>
  <text x="900" y="726" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">3 · IA lê a nota inteira (itens)</text>

