    <rect x="95" y="16" width="90" height="8" rx="4" fill="#ddd"/>
    <text x="20" y="60" font-size="15" font-weight="bold" fill="#111">Início</text>
    <line x1="14" y1="74" x2="266" y2="74" stroke="#eee" stroke-width="2"/>
    <rect x="16" y="88" width="248" height="40" rx="20" fill="#f5f5f5" stroke="#111" stroke-width="1.5"/>
    <circle cx="38" cy="108" r="7" fill="none" stroke="#666" stroke-width="2"/>
    <line x1="43" y1="113" x2="50" y2="120" stroke="#666" stroke-width="2"/>
