    <rect x="188" y="280" width="68" height="20" rx="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="222" y="294" font-size="9" fill="#111" text-anchor="middle">Devolvida</text>
    <!-- card 3 -->
    <rect x="16" y="376" width="248" height="70" rx="12" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
    <text x="30" y="400" font-size="12" font-weight="bold" fill="#111">A. Costa · GHJ7K89</text>
    <rect x="30" y="412" width="120" height="9" rx="3" fill="#666"/>
    <rect x="30" y="426" width="140" height="12" rx="4" fill="#eee"/>
