    <rect x="16" y="96" width="248" height="320" rx="12" fill="#f0f0f0" stroke="#111" stroke-width="1.5" stroke-dasharray="6 5"/>
    <path d="M40 120 h-14 v14" fill="none" stroke="#111" stroke-width="2.5"/>
    <path d="M240 120 h14 v14" fill="none" stroke="#111" stroke-width="2.5"/>
    <path d="M40 392 h-14 v-14" fill="none" stroke="#111" stroke-width="2.5"/>
    <path d="M240 392 h14 v-14" fill="none" stroke="#111" stroke-width="2.5"/>
    <rect x="108" y="228" width="64" height="46" rx="8" fill="none" stroke="#888" stroke-width="2"/>
    <rect x="128" y="222" width="24" height="10" rx="3" fill="none" stroke="#888" stroke-width="2"/>
    <circle cx="140" cy="251" r="12" fill="none" stroke="#888" stroke-width="2"/>
    <text x="140" y="300" font-size="11" fill="#999" text-anchor="middle">Aponte para a nota fiscal</text>
    <rect x="16" y="440" width="248" height="50" rx="25" fill="#111"/>
